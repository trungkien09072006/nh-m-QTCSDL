<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập — NovaPath</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1 class="brand-name">nova<span>path</span></h1>
        <h2>Đăng nhập</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="notice notice-{{ 'error' if category == 'error' else 'success' }}" style="margin-bottom: 20px;">
                  <span class="notice-icon">{{ '!' if category == 'error' else '✓' }}</span>
                  <p style="margin: auto 0; font-size: 12px; font-weight: 600;">{{ message }}</p>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required class="form-control">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required class="form-control">
            </div>
            <button type="submit" class="btn-primary">Đăng nhập</button>
        </form>
        <p class="auth-footer">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
    </div>
</body>
</html>
