<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nội dung học tập · NovaPath</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f4f6fb;color:#18243c}header{background:#17284a;color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between}main{max-width:1200px;margin:32px auto;padding:0 24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}a{color:#255ac4}nav a,.button,button{display:inline-block;border:0;border-radius:7px;padding:10px 16px;background:#285aca;color:white;text-decoration:none;cursor:pointer;font:inherit}nav a{background:#e0e8fa;color:#183c83}nav a.active{background:#285aca;color:white}.card{background:white;border-radius:12px;padding:24px;box-shadow:0 4px 20px #17284a0b}.notice{padding:15px;margin:12px 0;border-radius:6px;background:#dff3e7}.error{background:#ffe5e5}input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;padding:11px;border:1px solid #bbc7d9;border-radius:6px;font:inherit}textarea{min-height:100px}label{display:block;margin:16px 0 8px}table{width:100%;border-collapse:collapse}td,th{padding:13px;text-align:left;border-bottom:1px solid #e1e7f0;vertical-align:top}td{max-width:380px;overflow-wrap:anywhere}.scroll{overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:6px 10px;font-size:14px}.danger{background:#a93140}.muted{color:#64728a}.option{display:flex;align-items:center;gap:12px;margin:12px 0}.toolbar{display:flex;gap:12px;margin:18px 0}.toolbar input{flex:1}form.inline{display:inline}small{font-size:13px}fieldset{border:1px solid #d5deed;margin:24px 0;padding:20px}</style></head><body>
<header><strong>NovaPath / Nội dung học tập</strong><div>{{ session.fullname }} · {{ session.role }} <form class="inline" action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Đăng xuất</button></form></div></header>
<main><nav>{% for key,meta in kinds.items() %}<a class="{{ 'active' if key==kind else '' }}" href="{{ url_for('content.listing',kind=key) }}">{{ meta[0] }}</a>{% endfor %}</nav>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div role="alert" class="notice {{ cat }}">{{ msg }}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
